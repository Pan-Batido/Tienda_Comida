<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Producto - Sakura Market 🌸</title>

  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body class="bg-light">

  <div class="d-flex flex-column flex-md-row min-vh-100">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="bg-dark text-white p-3 col-md-3 col-lg-2 d-flex flex-column">
      <a href="../index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-warning text-decoration-none fw-bold fs-5">
        <i class="bi bi-shield-lock-fill me-2"></i>Admin Sakura 🌸
      </a>
      <hr class="border-secondary">
      
      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
          <a href="../index.html" class="nav-link text-white">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
        </li>
        <li>
          <a href="../usuarios/listar.html" class="nav-link text-white">
            <i class="bi bi-people-fill me-2"></i>Usuarios
          </a>
        </li>
        <li>
          <a href="listar.html" class="nav-link active bg-warning text-dark fw-bold">
            <i class="bi bi-box-seam-fill me-2"></i>Productos
          </a>
        </li>
      </ul>

      <hr class="border-secondary">
      <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle fs-4 me-2 text-warning"></i>
          <strong>Admin Integrante 2</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
          <li><a class="dropdown-item" href="../../public/index.html"><i class="bi bi-shop me-2"></i>Ir a la Tienda</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="../../public/login.html"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
        </ul>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="col-md-9 col-lg-10 p-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
        <h1 class="h2 fw-bold text-dark"><i class="bi bi-pencil-square me-2 text-warning"></i>Gestión de Producto</h1>
        <a href="listar.html" class="btn btn-outline-dark btn-sm"><i class="bi bi-arrow-left me-1"></i>Volver al Listado</a>
      </div>

      <div class="card border-0 shadow-sm col-lg-10 mx-auto">
        <div class="card-header bg-dark text-white fw-bold py-3">
          <span class="text-warning">DATOS DEL PRODUCTO</span>
        </div>
        <div class="card-body p-4">

          <form id="formProducto" novalidate>
            <div class="row g-3">

              <!-- CÓDIGO SKU -->
              <div class="col-md-6">
                <label for="txtCodigo" class="form-label fw-semibold">Código / SKU <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="txtCodigo" placeholder="Ej: SKU-001" maxlength="20">
                <div id="errorCodigo" class="invalid-feedback"></div>
              </div>

              <!-- NOMBRE PRODUCTO -->
              <div class="col-md-6">
                <label for="txtNombreProd" class="form-label fw-semibold">Nombre del Producto <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="txtNombreProd" placeholder="Ej: Ramen Tonkotsu" maxlength="100">
                <div id="errorNombreProd" class="invalid-feedback"></div>
              </div>

              <!-- CATEGORÍA -->
              <div class="col-md-4">
                <label for="selectCategoria" class="form-label fw-semibold">Categoría <span class="text-danger">*</span></label>
                <select class="form-select" id="selectCategoria">
                  <option value="">-- Seleccionar --</option>
                  <option value="ramen">Ramen Instantáneo</option>
                  <option value="snacks">Snacks y Golosinas</option>
                  <option value="bebidas">Bebidas Asiáticas</option>
                  <option value="salsas">Salsas y Condimentos</option>
                </select>
                <div id="errorCategoria" class="invalid-feedback"></div>
              </div>

              <!-- PRECIO -->
              <div class="col-md-4">
                <label for="numPrecio" class="form-label fw-semibold">Precio ($ CLP) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="numPrecio" placeholder="Ej: 3500" min="1">
                <div id="errorPrecio" class="invalid-feedback"></div>
              </div>

              <!-- STOCK -->
              <div class="col-md-4">
                <label for="numStock" class="form-label fw-semibold">Stock Unidades <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="numStock" placeholder="Ej: 20" min="0">
                <div id="errorStock" class="invalid-feedback"></div>
              </div>

              <!-- URL DE IMAGEN (OPCIONAL/MOCKUP) -->
              <div class="col-12">
                <label for="txtImagen" class="form-label fw-semibold">URL de la Imagen <span class="text-muted fs-7">(Opcional)</span></label>
                <input type="url" class="form-control" id="txtImagen" placeholder="https://ejemplo.com/imagen.jpg">
              </div>

              <!-- DESCRIPCIÓN -->
              <div class="col-12">
                <label for="txtDescripcion" class="form-label fw-semibold">Descripción <span class="text-danger">*</span></label>
                <textarea class="form-control" id="txtDescripcion" rows="4" placeholder="Detalles, ingredientes, origen..." maxlength="300"></textarea>
                <div id="errorDescripcion" class="invalid-feedback"></div>
              </div>

              <!-- BOTONES -->
              <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                <a href="listar.html" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-warning fw-bold">Guardar Producto</button>
              </div>

            </div>
          </form>

        </div>
      </div>
    </main>

  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- ARCHIVO DE VALIDACIONES -->
  <script src="../../assets/js/validaciones.js"></script>

  <!-- LÓGICA DE VALIDACIÓN FORMULARIO PRODUCTO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      // Validar Código
      document.getElementById("txtCodigo").addEventListener("input", (e) => {
        const val = e.target.value.trim();
        const esValido = val.length >= 3 && val.length <= 20;
        mostrarError("txtCodigo", "errorCodigo", "El código es obligatorio (3 a 20 caracteres).", esValido);
      });

      // Validar Nombre
      document.getElementById("txtNombreProd").addEventListener("input", (e) => {
        const val = e.target.value.trim();
        const esValido = val.length >= 3 && val.length <= 100;
        mostrarError("txtNombreProd", "errorNombreProd", "El nombre del producto es obligatorio.", esValido);
      });

      // Validar Categoría
      document.getElementById("selectCategoria").addEventListener("change", (e) => {
        const val = e.target.value;
        const esValido = val !== "";
        mostrarError("selectCategoria", "errorCategoria", "Debe seleccionar una categoría.", esValido);
      });

      // Validar Precio
      document.getElementById("numPrecio").addEventListener("input", (e) => {
        const val = parseInt(e.target.value);
        const esValido = !isNaN(val) && val > 0;
        mostrarError("numPrecio", "errorPrecio", "Ingrese un precio válido mayor a 0.", esValido);
      });

      // Validar Stock
      document.getElementById("numStock").addEventListener("input", (e) => {
        const val = parseInt(e.target.value);
        const esValido = !isNaN(val) && val >= 0;
        mostrarError("numStock", "errorStock", "Ingrese un stock válido (0 o mayor).", esValido);
      });

      // Validar Descripción
      document.getElementById("txtDescripcion").addEventListener("input", (e) => {
        const val = e.target.value.trim();
        const esValido = val.length >= 10 && val.length <= 300;
        mostrarError("txtDescripcion", "errorDescripcion", "La descripción debe tener entre 10 y 300 caracteres.", esValido);
      });

      // Submit Form
      document.getElementById("formProducto").addEventListener("submit", (e) => {
        e.preventDefault();

        // Disparar eventos de validación
        ["txtCodigo", "txtNombreProd", "numPrecio", "numStock", "txtDescripcion"].forEach(id => {
          document.getElementById(id).dispatchEvent(new Event('input'));
        });
        document.getElementById("selectCategoria").dispatchEvent(new Event('change'));

        const hayErrores = document.querySelectorAll('.is-invalid').length > 0;

        if (!hayErrores) {
          alert("¡Producto guardado exitosamente!");
          window.location.href = "listar.html";
        } else {
          alert("Por favor, corrija los campos marcados en rojo.");
        }
      });

    });
  </script>

</body>
</html>
