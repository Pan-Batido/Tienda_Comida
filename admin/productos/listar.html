<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos</title>

  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-light">

  <div class="d-flex flex-column flex-md-row min-vh-100">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="bg-dark text-white p-3 col-md-3 col-lg-2 d-flex flex-column">
      <a href="../index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-warning text-decoration-none fw-bold fs-5">
        <i class="bi bi-shield-lock-fill me-2"></i>Admin Sakura 🌸
      </a>
      <hr class="border-secondary">
      
      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
          <a href="../index.html" class="nav-link text-white">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
        </li>
        <li>
          <a href="../usuarios/listar.html" class="nav-link text-white">
            <i class="bi bi-people-fill me-2"></i>Usuarios
          </a>
        </li>
        <li>
          <a href="listar.html" class="nav-link active bg-warning text-dark fw-bold">
            <i class="bi bi-box-seam-fill me-2"></i>Productos
          </a>
        </li>
      </ul>

      <hr class="border-secondary">
      <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle fs-4 me-2 text-warning"></i>
          <strong>Admin Integrante 2</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
          <li><a class="dropdown-item" href="../../vista_tienda/index.html"><i class="bi bi-shop me-2"></i>Ir a la Tienda</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="../../vista_tienda/login.html"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
        </ul>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="col-md-9 col-lg-10 p-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
        <h1 class="h2 fw-bold text-dark"><i class="bi bi-box-seam me-2 text-warning"></i>Gestor de Productos</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
          <a href="formulario.html" class="btn btn-warning fw-bold">
            <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
          </a>
        </div>
      </div>

      <!-- BUSCADOR Y FILTROS -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" id="txtBuscar" class="form-control" placeholder="Buscar por ID o nombre..." onkeyup="filtrarProductos()">
              </div>
            </div>
            <div class="col-md-4">
              <select id="selectCategoriaFiltro" class="form-select" onchange="filtrarProductos()">
                <option value="">Todas las Categorías</option>
                <option value="Comida">Comida / Ramen</option>
                <option value="Snacks">Snacks y Golosinas</option>
                <option value="Bebidas">Bebidas Asiáticas</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-dark w-100" onclick="filtrarProductos()"><i class="bi bi-funnel me-1"></i>Filtrar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- TABLA DE PRODUCTOS -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col" class="ps-3">ID</th>
                  <th scope="col">Imagen</th>
                  <th scope="col">Nombre del Producto</th>
                  <th scope="col">Categoría</th>
                  <th scope="col">Precio</th>
                  <th scope="col" class="text-end pe-3">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaProductosBody">
                <!-- Se rellena dinámicamente con JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>

  </div>

  <!-- Carga productos.js) -->
  <script src="../../js/productos.js"></script>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- LÓGICA DE GESTIÓN Y PERSISTENCIA -->
  <script>
    // Inicializa datos en localStorage si es la primera vez que se accede
    function obtenerProductos() {
      let productosGuardados = localStorage.getItem("productos_db");
      
      if (!productosGuardados) {
        // Si viene desde productos.js se carga la constante productosAsia
        const listaInicial = (typeof productosAsia !== "undefined") ? productosAsia : [];
        localStorage.setItem("productos_db", JSON.stringify(listaInicial));
        return listaInicial;
      }
      
      return JSON.parse(productosGuardados);
    }

    // Renderiza los productos en la tabla HTML
    function renderizarTabla(lista) {
      const tbody = document.getElementById("tablaProductosBody");
      tbody.innerHTML = "";

      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No se encontraron productos registrados.</td></tr>`;
        return;
      }

      lista.forEach(prod => {
        tbody.innerHTML += `
          <tr>
            <td class="ps-3 fw-bold">#${prod.id}</td>
            <td>
              <img src="../${prod.imagen}" alt="${prod.nombre}" class="rounded" width="45" height="45" style="object-fit: cover;" onerror="this.src='../../img/default.png'">
            </td>
            <td class="fw-semibold">${prod.nombre}</td>
            <td><span class="badge bg-success">${prod.categoria}</span></td>
            <td class="fw-bold text-success">$${prod.precio.toLocaleString("cl-CL")}</td>
            <td class="text-end pe-3">
              <a href="formulario.html?id=${prod.id}" class="btn btn-sm btn-outline-dark me-1" title="Editar"><i class="bi bi-pencil-fill"></i></a>
              <button class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="eliminarProducto(${prod.id})"><i class="bi bi-trash-fill"></i></button>
            </td>
          </tr>
        `;
      });
    }

    

    // Función para eliminar un producto
    function eliminarProducto(id) {
      if (confirm(`¿Está seguro de que desea eliminar el producto con ID #${id}?`)) {
        let productos = obtenerProductos();
        productos = productos.filter(p => p.id !== id);
        localStorage.setItem("productos_db", JSON.stringify(productos));
        filtrarProductos(); // Refresca el listado visual
      }
    }

    // Función para el buscador y filtro
    function filtrarProductos() {
      const productos = obtenerProductos();
      const texto = document.getElementById("txtBuscar").value.toLowerCase();
      const categoria = document.getElementById("selectCategoriaFiltro").value;

      const resultados = productos.filter(p => {
        const coincideTexto = p.nombre.toLowerCase().includes(texto) || p.id.toString().includes(texto);
        const coincideCategoria = categoria === "" || p.categoria === categoria;
        return coincideTexto && coincideCategoria;
      });

      renderizarTabla(resultados);
    }

    // Carga inicial
    document.addEventListener("DOMContentLoaded", () => {
      renderizarTabla(obtenerProductos());
    });
  </script>

</body>
</html>
