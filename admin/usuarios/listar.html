<!DOCTYPE html>

</head>
<body class="bg-light">

  <div class="d-flex flex-column flex-md-row min-vh-100">

    <!-- BARRA LATERAL (SIDEBAR) -->

      </a>
      <hr class="border-secondary">
      
      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
          <a href="../index.html" class="nav-link text-white">

          </a>

        <li>
          <a href="listar.html" class="nav-link active bg-warning text-dark fw-bold">

        </li>
      </ul>

      <hr class="border-secondary">
      <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle fs-4 me-2 text-warning"></i>
          <strong>Admin</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
          <li><a class="dropdown-item" href="../../vista_tienda/index.html"><i class="bi bi-shop me-2"></i>Ir a la Tienda</a></li>
          <li><hr class="dropdown-divider"></li>

        </ul>

    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="col-md-9 col-lg-10 p-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
        <h1 class="h2 fw-bold text-dark"><i class="bi bi-people-fill me-2 text-warning"></i>Gestor de Usuarios</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
          <a href="formulario.html" class="btn btn-warning fw-bold">
            <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
          </a>
        </div>
      </div>

      <!-- BUSCADOR -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-8">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" id="txtBuscarUsuario" class="form-control" placeholder="Buscar por nombre, correo o RUT..." onkeyup="filtrarUsuarios()">
              </div>
            </div>
            <div class="col-md-4">
              <select id="selectRolFiltro" class="form-select" onchange="filtrarUsuarios()">
                <option value="">Todos los Roles</option>
                <option value="Administrador">Administrador</option>
                <option value="Cliente">Cliente</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- TABLA DE USUARIOS -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col" class="ps-3">RUT</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Correo</th>
                  <th scope="col">Rol</th>
                  <th scope="col" class="text-end pe-3">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaUsuariosBody">
                <!-- Se llena dinámicamente -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>

  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Carga usuarios -->
  <script src="../../js/usuarios.js"></script>
  <!-- LÓGICA DE USUARIOS -->
  <script>

    function obtenerUsuarios() {
      let usuariosGuardados = localStorage.getItem("usuarios_db");
      
      if (!usuariosGuardados) {
        // Si no hay datos guardados, usamos los del archivo usuarios.js
        localStorage.setItem("usuarios_db", JSON.stringify(usuariosBase));
        return usuariosBase;
      }
      
      return JSON.parse(usuariosGuardados);
    }

    function renderizarTabla(lista) {
      const tbody = document.getElementById("tablaUsuariosBody");
      tbody.innerHTML = "";

      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No hay usuarios registrados.</td></tr>`;
        return;
      }

      lista.forEach(user => {
        const badgeRol = user.rol === "Administrador" ? "bg-danger" : "bg-primary";
        tbody.innerHTML += `
          <tr>
            <td class="ps-3 fw-bold">${user.rut}</td>
            <td class="fw-semibold">${user.nombre}</td>
            <td>${user.correo}</td>
            <td><span class="badge ${badgeRol}">${user.rol}</span></td>
            <td class="text-end pe-3">
              <a href="formulario.html?rut=${user.rut}" class="btn btn-sm btn-outline-dark me-1" title="Editar"><i class="bi bi-pencil-fill"></i></a>
              <button class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="eliminarUsuario('${user.rut}')"><i class="bi bi-trash-fill"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function eliminarUsuario(rut) {
      if (confirm(`¿Está seguro de eliminar al usuario con RUT ${rut}?`)) {
        let usuarios = obtenerUsuarios();
        usuarios = usuarios.filter(u => u.rut !== rut);
        localStorage.setItem("usuarios_db", JSON.stringify(usuarios));
        filtrarUsuarios();
      }
    }

    function filtrarUsuarios() {
      const usuarios = obtenerUsuarios();
      const texto = document.getElementById("txtBuscarUsuario").value.toLowerCase();
      const rol = document.getElementById("selectRolFiltro").value;

      const resultados = usuarios.filter(u => {
        const coincideTexto = u.nombre.toLowerCase().includes(texto) || u.correo.toLowerCase().includes(texto) || u.rut.toLowerCase().includes(texto);
        const coincideRol = rol === "" || u.rol === rol;
        return coincideTexto && coincideRol;
      });

      renderizarTabla(resultados);
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderizarTabla(obtenerUsuarios());
    });
  </script>

</body>
</html>
