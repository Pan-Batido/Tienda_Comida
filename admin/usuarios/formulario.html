<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Usuario - Sakura Market 🌸</title>

  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body class="bg-light">

  <div class="d-flex flex-column flex-md-row min-vh-100">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="bg-dark text-white p-3 col-md-3 col-lg-2 d-flex flex-column">
      <a href="../index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-warning text-decoration-none fw-bold fs-5">
        <i class="bi bi-shield-lock-fill me-2"></i>Admin Sakura 🌸
      </a>
      <hr class="border-secondary">
      
      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
          <a href="../index.html" class="nav-link text-white">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
        </li>
        <li>
          <a href="listar.html" class="nav-link active bg-warning text-dark fw-bold">
            <i class="bi bi-people-fill me-2"></i>Usuarios
          </a>
        </li>
        <li>
          <a href="../productos/listar.html" class="nav-link text-white">
            <i class="bi bi-box-seam-fill me-2"></i>Productos
          </a>
        </li>
      </ul>

      <hr class="border-secondary">
      <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle fs-4 me-2 text-warning"></i>
          <strong>Admin Integrante 2</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
          <li><a class="dropdown-item" href="../../public/index.html"><i class="bi bi-shop me-2"></i>Ir a la Tienda</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="../../public/login.html"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
        </ul>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="col-md-9 col-lg-10 p-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
        <h1 class="h2 fw-bold text-dark"><i class="bi bi-person-gear me-2 text-warning"></i>Gestión de Usuario</h1>
        <a href="listar.html" class="btn btn-outline-dark btn-sm"><i class="bi bi-arrow-left me-1"></i>Volver al Listado</a>
      </div>

      <div class="card border-0 shadow-sm col-lg-10 mx-auto">
        <div class="card-header bg-dark text-white fw-bold py-3">
          <span class="text-warning">DATOS DEL USUARIO</span>
        </div>
        <div class="card-body p-4">

          <form id="formAdminUsuario" novalidate>
            <div class="row g-3">

              <!-- RUN -->
              <div class="col-md-6">
                <label for="txtRunAdmin" class="form-label fw-semibold">RUN <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="txtRunAdmin" placeholder="12345678-9" maxlength="10">
                <div id="errorRunAdmin" class="invalid-feedback"></div>
              </div>

              <!-- NOMBRE -->
              <div class="col-md-6">
                <label for="txtNombreAdmin" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="txtNombreAdmin" placeholder="Tu nombre" maxlength="50">
                <div id="errorNombreAdmin" class="invalid-feedback"></div>
              </div>

              <!-- APELLIDOS -->
              <div class="col-md-6">
                <label for="txtApellidosAdmin" class="form-label fw-semibold">Apellidos <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="txtApellidosAdmin" placeholder="Tus apellidos" maxlength="100">
                <div id="errorApellidosAdmin" class="invalid-feedback"></div>
              </div>

              <!-- CORREO -->
              <div class="col-md-6">
                <label for="txtCorreoAdmin" class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="txtCorreoAdmin" placeholder="ejemplo@duoc.cl" maxlength="100">
                <div id="errorCorreoAdmin" class="invalid-feedback"></div>
              </div>

              <!-- ROL -->
              <div class="col-md-4">
                <label for="selectRolAdmin" class="form-label fw-semibold">Rol del Sistema <span class="text-danger">*</span></label>
                <select class="form-select" id="selectRolAdmin">
                  <option value="">-- Seleccionar --</option>
                  <option value="cliente">Cliente</option>
                  <option value="admin">Administrador</option>
                </select>
                <div id="errorRolAdmin" class="invalid-feedback"></div>
              </div>

              <!-- REGIÓN -->
              <div class="col-md-4">
                <label for="selectRegionAdmin" class="form-label fw-semibold">Región <span class="text-danger">*</span></label>
                <select class="form-select" id="selectRegionAdmin">
                  <option value="">-- Seleccionar --</option>
                  <option value="RM">Metropolitana de Santiago</option>
                  <option value="VS">Valparaíso</option>
                  <option value="BI">Biobío</option>
                </select>
                <div id="errorRegionAdmin" class="invalid-feedback"></div>
              </div>

              <!-- COMUNA -->
              <div class="col-md-4">
                <label for="selectComunaAdmin" class="form-label fw-semibold">Comuna <span class="text-danger">*</span></label>
                <select class="form-select" id="selectComunaAdmin">
                  <option value="">-- Seleccionar --</option>
                  <option value="Providencia">Providencia</option>
                  <option value="Santiago">Santiago</option>
                  <option value="Viña del Mar">Viña del Mar</option>
                  <option value="Concepción">Concepción</option>
                </select>
                <div id="errorComunaAdmin" class="invalid-feedback"></div>
              </div>

              <!-- DIRECCIÓN -->
              <div class="col-12">
                <label for="txtDireccionAdmin" class="form-label fw-semibold">Dirección <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="txtDireccionAdmin" placeholder="Calle, número, depto" maxlength="300">
                <div id="errorDireccionAdmin" class="invalid-feedback"></div>
              </div>

              <!-- BOTONES -->
              <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                <a href="listar.html" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-warning fw-bold">Guardar Usuario</button>
              </div>

            </div>
          </form>

        </div>
      </div>
    </main>

  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- ARCHIVO DE VALIDACIONES -->
  <script src="../../assets/js/validaciones.js"></script>

  <!-- LÓGICA DE VALIDACIÓN -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      document.getElementById("txtRunAdmin").addEventListener("input", (e) => {
        mostrarError("txtRunAdmin", "errorRunAdmin", "RUN inválido. Formato: 12345678-9 (sin puntos).", validarRUN(e.target.value.trim()));
      });

      document.getElementById("txtNombreAdmin").addEventListener("input", (e) => {
        mostrarError("txtNombreAdmin", "errorNombreAdmin", "El nombre es obligatorio (máx 50 car).", validarRequerido(e.target.value, 1, 50));
      });

      document.getElementById("txtApellidosAdmin").addEventListener("input", (e) => {
        mostrarError("txtApellidosAdmin", "errorApellidosAdmin", "Los apellidos son obligatorios (máx 100 car).", validarRequerido(e.target.value, 1, 100));
      });

      document.getElementById("txtCorreoAdmin").addEventListener("input", (e) => {
        mostrarError("txtCorreoAdmin", "errorCorreoAdmin", "Correo inválido. Dominios: @duoc.cl, @profesor.duoc.cl, @gmail.com.", validarEmail(e.target.value.trim()));
      });

      document.getElementById("selectRolAdmin").addEventListener("change", (e) => {
        mostrarError("selectRolAdmin", "errorRolAdmin", "Debe seleccionar un rol.", e.target.value !== "");
      });

      document.getElementById("selectRegionAdmin").addEventListener("change", (e) => {
        mostrarError("selectRegionAdmin", "errorRegionAdmin", "Debe seleccionar una región.", e.target.value !== "");
      });

      document.getElementById("selectComunaAdmin").addEventListener("change", (e) => {
        mostrarError("selectComunaAdmin", "errorComunaAdmin", "Debe seleccionar una comuna.", e.target.value !== "");
      });

      document.getElementById("txtDireccionAdmin").addEventListener("input", (e) => {
        mostrarError("txtDireccionAdmin", "errorDireccionAdmin", "La dirección es obligatoria (máx 300 car).", validarRequerido(e.target.value, 1, 300));
      });

      // Submit Form
      document.getElementById("formAdminUsuario").addEventListener("submit", (e) => {
        e.preventDefault();

        ["txtRunAdmin", "txtNombreAdmin", "txtApellidosAdmin", "txtCorreoAdmin", "txtDireccionAdmin"].forEach(id => {
          document.getElementById(id).dispatchEvent(new Event('input'));
        });
        ["selectRolAdmin", "selectRegionAdmin", "selectComunaAdmin"].forEach(id => {
          document.getElementById(id).dispatchEvent(new Event('change'));
        });

        const hayErrores = document.querySelectorAll('.is-invalid').length > 0;

        if (!hayErrores) {
          alert("¡Usuario guardado exitosamente!");
          window.location.href = "listar.html";
        } else {
          alert("Por favor, corrija los campos marcados en rojo.");
        }
      });

    });
  </script>

</body>
</html>
