<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Usuario</title>

  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-light">

  <div class="d-flex flex-column flex-md-row min-vh-100">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="bg-dark text-white p-3 col-md-3 col-lg-2 d-flex flex-column">
      <a href="../index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-warning text-decoration-none fw-bold fs-5">
        <i class="bi bi-shield-lock-fill me-2"></i>Admin Sakura 🌸
      </a>
      <hr class="border-secondary">
      
      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
          <a href="../index.html" class="nav-link text-white">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
        </li>
        <li>
          <a href="listar.html" class="nav-link active bg-warning text-dark fw-bold">
            <i class="bi bi-people-fill me-2"></i>Usuarios
          </a>
        </li>
        <li>
          <a href="../productos/listar.html" class="nav-link text-white">
            <i class="bi bi-box-seam-fill me-2"></i>Productos
          </a>
        </li>
      </ul>

      <hr class="border-secondary">
      <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle fs-4 me-2 text-warning"></i>
          <strong>Admin</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
          <li><a class="dropdown-item" href="../../vista_tienda/index.html"><i class="bi bi-shop me-2"></i>Ir a la Tienda</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="../../vista_tienda/login.html"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
        </ul>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="col-md-9 col-lg-10 p-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
        <h1 class="h2 fw-bold text-dark"><i class="bi bi-person-gear me-2 text-warning"></i>Gestión de Usuario</h1>
        <a href="listar.html" class="btn btn-outline-dark btn-sm"><i class="bi bi-arrow-left me-1"></i>Volver al Listado</a>
      </div>

      <div class="card border-0 shadow-sm col-lg-8 mx-auto">
        <div class="card-header bg-dark text-white fw-bold py-3">
          <span class="text-warning" id="subtituloHeader">DATOS DEL USUARIO</span>
        </div>
        <div class="card-body p-4">

          <form id="formUsuario" novalidate>
            <div class="row g-3">

              <!-- RUT -->
              <div class="col-md-6">
                <label for="txtRut" class="form-label fw-semibold">RUT <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="txtRut" placeholder="Ej: 12345678-9" required>
                <div class="invalid-feedback">El RUT es obligatorio.</div>
              </div>

              <!-- NOMBRE -->
              <div class="col-md-6">
                <label for="txtNombre" class="form-label fw-semibold">Nombre Completo <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="txtNombre" placeholder="Ej: Ana María" required>
                <div class="invalid-feedback">Ingrese un nombre válido.</div>
              </div>

              <!-- CORREO -->
              <div class="col-md-6">
                <label for="txtCorreo" class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="txtCorreo" placeholder="correo@ejemplo.com" required>
                <div class="invalid-feedback">Ingrese un correo válido.</div>
              </div>

              <!-- ROL -->
              <div class="col-md-6">
                <label for="selectRol" class="form-label fw-semibold">Rol <span class="text-danger">*</span></label>
                <select class="form-select" id="selectRol" required>
                  <option value="">-- Seleccionar --</option>
                  <option value="Cliente">Cliente</option>
                  <option value="Administrador">Administrador</option>
                </select>
                <div class="invalid-feedback">Seleccione un rol.</div>
              </div>

              <!-- BOTONES -->
              <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                <a href="listar.html" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-warning fw-bold">Guardar Usuario</button>
              </div>

            </div>
          </form>

        </div>
      </div>
    </main>

  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/usuarios.js"></script>
  <!-- LÓGICA DE GUARDADO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rutEditar = urlParams.get("rut");

      const txtRut = document.getElementById("txtRut");
      const txtNombre = document.getElementById("txtNombre");
      const txtCorreo = document.getElementById("txtCorreo");
      const selectRol = document.getElementById("selectRol");
      const formUsuario = document.getElementById("formUsuario");

      // <-- CAMBIO 2: Si localStorage está vacío, toma 'usuariosBase' que viene del archivo usuarios.js
      let usuarios = JSON.parse(localStorage.getItem("usuarios_db")) || usuariosBase;

      // Cargar datos si se va a editar
      if (rutEditar) {
        document.getElementById("subtituloHeader").innerText = "EDITAR USUARIO " + rutEditar;
        const usuarioEncontrado = usuarios.find(u => u.rut === rutEditar);

        if (usuarioEncontrado) {
          txtRut.value = usuarioEncontrado.rut;
          txtRut.disabled = true; // El RUT no se edita por ser identificador único
          txtNombre.value = usuarioEncontrado.nombre;
          txtCorreo.value = usuarioEncontrado.correo;
          selectRol.value = usuarioEncontrado.rol;
        }
      }

      formUsuario.addEventListener("submit", (e) => {
        e.preventDefault();

        const vRut = txtRut.value.trim() !== "";
        const vNombre = txtNombre.value.trim() !== "";
        const vCorreo = txtCorreo.value.trim() !== "";
        const vRol = selectRol.value !== "";

        if (vRut && vNombre && vCorreo && vRol) {
          if (rutEditar) {
            // Actualizar existente
            usuarios = usuarios.map(u => u.rut === rutEditar ? {
              rut: rutEditar,
              nombre: txtNombre.value.trim(),
              correo: txtCorreo.value.trim(),
              rol: selectRol.value
            } : u);
            alert("¡Usuario actualizado con éxito!");
          } else {
            // Crear nuevo
            const existe = usuarios.some(u => u.rut === txtRut.value.trim());
            if (existe) {
              alert("El RUT ingresado ya existe.");
              return;
            }

            usuarios.push({
              rut: txtRut.value.trim(),
              nombre: txtNombre.value.trim(),
              correo: txtCorreo.value.trim(),
              rol: selectRol.value
            });
            alert("¡Usuario creado con éxito!");
          }

          localStorage.setItem("usuarios_db", JSON.stringify(usuarios));
          window.location.href = "listar.html";
        } else {
          alert("Por favor complete todos los campos requeridos.");
        }
      });
    });
  </script>

</body>
</html>
