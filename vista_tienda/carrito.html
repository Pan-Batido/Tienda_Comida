<div class="container my-5">
  <h2>Tu Carrito de Compras Asiático</h2>
  
  <div class="table-responsive mt-4">
    <table class="table align-middle">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Subtotal</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-carrito">
        <!-- Filas dinámicas -->
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <h4>Total: <span id="total-precio" class="text-success">$0</span></h4>
    <button class="btn btn-success btn-lg" onclick="comprar()">Finalizar Compra</button>
  </div>
</div>
